name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  prober:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: prober } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: prober/go.mod }
      - run: go vet ./...
      - run: go test -race ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: |
          for d in persistent compute; do
            terraform -chdir=infra/terraform/$d init -backend=false -input=false
            terraform -chdir=infra/terraform/$d validate
          done

  # Runs only after bootstrap: set repo variable AWS_PLAN_ROLE_ARN to the github_plan_role_arn output.
  terraform-plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: plan compute
        run: |
          bucket="multibase-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          cd infra/terraform/compute
          terraform init -input=false -backend-config="bucket=$bucket" \
            -backend-config="key=multibase/compute.tfstate" -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock=false

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: for c in gitops/charts/*; do helm lint "$c"; done

  image:
    if: github.ref == 'refs/heads/main'
    needs: [prober]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: prober
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/multibase-prober:${{ github.sha }}
