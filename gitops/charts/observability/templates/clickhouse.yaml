apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init
  namespace: observability
data:
  schema.sql: |
{{ .Files.Get "files/schema.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: observability
spec:
  selector: { app: clickhouse }
  ports:
    - { name: http, port: 8123 }
    - { name: native, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: observability
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: { app: clickhouse }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouseImage }}
          ports:
            - { containerPort: 8123 }
            - { containerPort: 9000 }
          env:
            - { name: CLICKHOUSE_SKIP_USER_SETUP, value: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
      volumes:
        - name: init
          configMap: { name: clickhouse-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.storageSize }} }
