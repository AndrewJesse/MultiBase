apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prober
  namespace: observability
spec:
  selector:
    matchLabels: { app: prober }
  template:
    metadata:
      labels: { app: prober }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: prober
          image: { { .Values.image } }
          ports:
            - { name: metrics, containerPort: 9100 }
          env:
            - name: SITE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - {
                name: PG_PRIMARY_DSN,
                value: { { .Values.primaryDsn | quote } },
              }
            - {
                name: PG_REPLICA_DSN,
                value: { { .Values.replicaDsn | quote } },
              }
            - { name: AUTH_URL, value: { { .Values.authUrl | quote } } }
            - {
                name: CLICKHOUSE_URL,
                value: { { .Values.clickhouseUrl | quote } },
              }
            - name: PGPASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: prober-pg, key: password, optional: true },
                }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prober
  namespace: observability
spec:
  selector:
    matchLabels: { app: prober }
  podMetricsEndpoints:
    - { port: metrics }
